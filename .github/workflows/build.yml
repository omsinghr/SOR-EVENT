name: Build APK from ZIP File

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Project ZIP
        run: |
          ZIP_FILE=$(ls *.zip | head -n 1)
          echo "Extracting $ZIP_FILE..."
          unzip -o "$ZIP_FILE" -d extracted_project
          
          if [ -d "extracted_project/app" ]; then
            cp -r extracted_project/* .
          else
            SUBDIR=$(find extracted_project -maxdepth 1 -mindepth 1 -type d | head -n 1)
            if [ -n "$SUBDIR" ]; then
              cp -r $SUBDIR/* .
            fi
          fi
          
          # 1. Remove corrupted gradlew files to use system gradle
          rm -f gradlew gradlew.bat
          rm -rf gradle/wrapper/

          # 2. Create required .env files
          touch .env.example
          touch .env
          echo "GEMINI_API_KEY=MY_GEMINI_API_KEY" > .env.example
          echo "GEMINI_API_KEY=MY_GEMINI_API_KEY" > .env

          # 3. Create missing debug.keystore file for signing
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        env:
          JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true"
        run: gradle assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SOR-EVENT-APK
          path: '**/build/outputs/apk/debug/*.apk'
