name: Build APK from ZIP File

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Project ZIP
        run: |
          ZIP_FILE=$(ls *.zip | head -n 1)
          echo "Extracting $ZIP_FILE..."
          unzip -o "$ZIP_FILE" -d extracted_project
          
          if [ -d "extracted_project/app" ]; then
            cp -r extracted_project/* .
          else
            SUBDIR=$(find extracted_project -maxdepth 1 -mindepth 1 -type d | head -n 1)
            if [ -n "$SUBDIR" ]; then
              cp -r $SUBDIR/* .
            fi
          fi
          
          # Fix: Remove corrupted gradlew files so GitHub uses system gradle
          rm -f gradlew gradlew.bat
          rm -rf gradle/wrapper/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SOR-EVENT-APK
          path: '**/build/outputs/apk/debug/*.apk'
